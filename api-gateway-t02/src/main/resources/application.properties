spring.application.name=api-gateway-t02

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webflux.routes[0].id=paciente-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PACIENTE-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/pacientes/**

spring.cloud.gateway.server.webflux.routes[1].id=cita-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CITA-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/citas/**